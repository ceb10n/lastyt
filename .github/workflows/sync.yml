name: Sync YouTube Music → Last.fm

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:      # allow manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # Persist state.json between runs so we don't re-scrobble old tracks.
      # A new cache entry is saved each run; the most recent one is restored.
      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: state.json
          key: lastyt-state-${{ github.run_id }}
          restore-keys: lastyt-state-

      - name: Install dependencies
        run: pip install .

      - name: Run sync
        env:
          YTM_HEADERS: ${{ secrets.YTM_HEADERS }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          LASTFM_PASSWORD: ${{ secrets.LASTFM_PASSWORD }}
        run: python main.py
